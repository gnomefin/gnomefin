name: Latest blog post workflow
on:
  schedule: # Run workflow automatically
    - cron: '0 * * * *' # Runs every hour, on the hour
  workflow_dispatch: # Run workflow manually (without waiting for the cron to be called), through the GitHub Actions Workflow page directly
permissions:
  contents: write # To write the generated contents to the readme

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.alfianfirmansyah.com/rss/"
          # List write-ups only. Skip site entries for certifications, education, work, impact, awards and speaking.
          item_exec: |
            const skip = ['certification', 'education', 'work', 'impact', 'award', 'speaking'];
            const names = (post.categories || []).map((c) => String(typeof c === 'string' ? c : (c && (c._ || c.term || c.name)) || '').toLowerCase());
            if (names.some((n) => skip.includes(n))) { post = null; }
